brokerClusterName=ABDevCluster
brokerName=ab-dev-broker
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=SYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
aclEnable=true
# Local development runs A and B on the Windows host, using the published loopback ports.
brokerIP1=127.0.0.1
listenPort=10911
# Consumer retries use levels 3/4/5/6: 1/2/4/8 minutes, then remain at 8 minutes.
messageDelayLevel=1s 5s 1m 2m 4m 8m 10m 20m 30m 1h 2h
