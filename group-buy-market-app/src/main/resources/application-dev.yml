server:
  port: 8091

dubbo:
  application:
    name: group-buy-market-v2
  protocol:
    name: tri
    port: 50051
  registry:
    address: N/A

ab:
  v2:
    env: dev
    enabled: false
    rocketmq:
      nameserver: 127.0.0.1:9876
      # Explicit exception for the loopback-only development Broker.
      require-tls: false

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: AbortPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: jdbc:mysql://127.0.0.1:13306/group_buy_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&connectTimeout=5000&socketTimeout=5000
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource

# MyBatis 配置
mybatis:
  config-location: classpath:mybatis/config/mybatis-config.xml
  mapper-locations: classpath:mybatis/mapper/*.xml

# Redis
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# 日志
logging:
  level:
    root: info
    cn.bugstack.infrastructure.dao: debug
    cn.bugstack.infrastructure.adapter.repository: debug
  config: classpath:logback-spring.xml
