# Activate together with the normal database/environment profile; provide certificate paths externally.
dubbo:
  protocol:
    ssl-enabled: true
  ssl:
    server-key-cert-chain-path: ${AB_V2_TLS_SERVER_CERT}
    server-private-key-path: ${AB_V2_TLS_SERVER_KEY}
    server-trust-cert-collection-path: ${AB_V2_TLS_CLIENT_CA}

ab:
  v2:
    rpc:
      require-tls: true
